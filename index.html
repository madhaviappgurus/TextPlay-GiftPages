<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Pages</title>

    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <style>
        :root {
            --green: #07E992;
            --darktext: #050529;
            --white: #ffffff;
            --lightgrey: #C0C0C9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <section class="open-gift">
        <div class="logo">
            <img src="./images/main-logo.svg" alt="main logo">

    </section>

    <!-- ================= SCREEN 2 ================= -->
    <section class="claim-gift d-none">
      
    </section>

    <!-- ================= SCREEN 3 ================= -->
    <section class="download-app d-none">
        <div class="logo">
            <img src="./images/main-logo.svg" alt="main logo">
        </div>
    </section>

</html>
